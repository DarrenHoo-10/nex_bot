<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>NexBot Client</title><link rel="stylesheet" href="style.css"></head>
<body><main><span class="mark">N</span><p class="eyebrow">NEXBOT CLIENT</p><h1>连接你的个人 Agent</h1><p>Agent、消息与记忆保存在主设备。此客户端连接同一个 Core，也可以提供本机文件和终端能力。</p><form id="connection"><label>主设备 Core 地址<input id="origin" required type="url" placeholder="http://192.168.1.10:8799" autocomplete="url"></label><label>此设备名称<input id="name" required maxlength="80" value="我的电脑"></label><label>一次性连接码<input id="code" required type="password" autocomplete="off" placeholder="主设备 → 设置 → 登录设备 → 生成连接码"></label><button id="connect">连接</button></form><p role="alert" id="error"></p><button id="retry" hidden>使用已保存的登录重新连接</button><small>主设备须开启局域网接入并保持运行；公网地址须使用 HTTPS。</small></main><script src="connection.js"></script></body></html>
