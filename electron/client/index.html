<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>NexBot</title><link rel="stylesheet" href="style.css"></head>
<body class="login-host"><main class="login-screen"><section class="login-card"><img class="mark" src="nexbot-mark.svg" width="56" height="56" alt="NexBot"><h1>登录 NexBot</h1><form id="connection" class="login-form"><input id="origin" type="hidden" value="https://bot.nexorai.com.cn"><input id="name" type="hidden" value="我的电脑"><label class="field">邮箱<input id="email" required type="email" maxlength="254" autocomplete="username" placeholder="输入你的邮箱"></label><label class="field">密码<input id="password" required type="password" maxlength="4096" autocomplete="current-password" placeholder="输入密码"></label><button id="connect" class="primary">登录</button></form><div id="resuming" role="status"><span class="spin"></span><p>正在恢复登录…</p><button id="other" type="button">改用其他账号登录</button></div><p role="alert" id="error" class="login-error"></p><button id="retry" hidden>重新连接</button><div class="login-signup">没有账号？<button id="register" type="button">去注册</button></div></section></main><script src="connection.js"></script></body></html>
