<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>NexBot Client</title><link rel="stylesheet" href="style.css"></head>
<body><main><span class="mark">N</span><p class="eyebrow">NEXBOT CLIENT</p><h1>连接你的个人 Agent</h1><p>使用与主设备相同的 NexorAI 账号登录。Agent、消息与记忆保存在主设备。</p><form id="connection"><label>主设备 Core 地址<input id="origin" required type="url" placeholder="https://你的主设备地址" autocomplete="url"></label><label>此设备名称<input id="name" required maxlength="80" value="我的电脑"></label><label>邮箱<input id="email" required type="email" maxlength="254" autocomplete="username"></label><label>密码<input id="password" required type="password" maxlength="4096" autocomplete="current-password"></label><button id="connect">登录并连接</button></form><p role="alert" id="error"></p><button id="retry" hidden>使用已保存的登录重新连接</button><small>请先在主设备完成首次登录，并保持主设备运行。跨设备账号登录须使用 HTTPS Core 地址。</small></main><script src="connection.js"></script></body></html>
