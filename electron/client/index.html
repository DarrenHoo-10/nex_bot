<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>NexBot Client</title><link rel="stylesheet" href="style.css"></head>
<body><main><span class="mark">N</span><p class="eyebrow">NEXBOT CLIENT</p><h1>登录你的个人 Agent</h1><p>使用 NexorAI 账号登录。Agent、消息与记忆由云端服务统一管理。</p><form id="connection"><details><summary>高级：后端服务地址</summary><label>后端服务地址<input id="origin" required type="url" value="https://bot.nexorai.com.cn" placeholder="https://你的后端地址" autocomplete="url"></label></details><label>此设备名称<input id="name" required maxlength="80" value="我的电脑"></label><label>邮箱<input id="email" required type="email" maxlength="254" autocomplete="username"></label><label>密码<input id="password" required type="password" maxlength="4096" autocomplete="current-password"></label><button id="connect">登录并连接</button></form><div id="resuming" role="status"><span class="spin"></span><p>正在恢复登录，连接云端服务…</p><button id="other" type="button">改用其他账号登录</button></div><p role="alert" id="error"></p><button id="retry" hidden>使用已保存的登录重新连接</button><small>默认连接云端服务 bot.nexorai.com.cn；使用自建后端时在“高级”中修改地址。远程连接须使用 HTTPS。</small></main><script src="connection.js"></script></body></html>
