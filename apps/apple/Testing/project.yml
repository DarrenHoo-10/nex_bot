name: NexRenderFixture
options:
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
packages:
  NexClientKit:
    path: ../Packages/NexClientKit
  NexMarkdown:
    path: ../Packages/NexMarkdown
targetTemplates:
  host:
    type: application
    sources:
      - path: RenderHost.swift
      - path: ../Shared/StaticHTMLMessage.swift
      - path: ../Shared/AgentAvatar.swift
      - path: ../Shared/GraphicAvatarBody.swift
      - path: ../Shared/RoleAvatarOptions.swift
      - path: ../Shared/Theme.swift
      - path: ../Shared/WorkspaceSurface.swift
      - path: ../Shared/Assets.xcassets
    dependencies:
      - package: NexClientKit
      - package: NexMarkdown
    settings:
      base:
        PRODUCT_MODULE_NAME: NexRenderFixture
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.renderfixture
  tests:
    type: bundle.unit-test
    sources:
      - path: ChartRenderingTests.swift
      - path: AvatarRenderingTests.swift
    dependencies:
      - package: NexClientKit
      - package: NexMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.renderfixture.tests
targets:
  RenderMac:
    templates: [host]
    platform: macOS
  RenderiOS:
    templates: [host]
    platform: iOS
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RenderMacTests:
    templates: [tests]
    platform: macOS
    dependencies:
      - target: RenderMac
  RenderiOSTests:
    templates: [tests]
    platform: iOS
    dependencies:
      - target: RenderiOS
schemes:
  RenderMac:
    build:
      targets: { RenderMac: all }
    test:
      targets: [RenderMacTests]
  RenderiOS:
    build:
      targets: { RenderiOS: all }
    test:
      targets: [RenderiOSTests]
