name: NexRenderFixture
options:
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
packages:
  NexClientKit:
    path: ../Packages/NexClientKit
  NexMarkdown:
    path: ../Packages/NexMarkdown
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0
targetTemplates:
  host:
    type: application
    sources:
      - path: RenderHost.swift
      - path: ../Shared/StaticHTMLMessage.swift
      - path: ../Shared/HTMLPreviewMessage.swift
      - path: ../Shared/AgentAvatar.swift
      - path: ../Shared/QAvatarBody.swift
      - path: ../../../public/companions
        type: folder
        buildPhase: resources
      - path: ../../../src/personal/avatars/character-sprites.json
        buildPhase: resources
      - path: ../Shared/GraphicAvatarBody.swift
      - path: ../Shared/RoleAvatarOptions.swift
      - path: ../Shared/Theme.swift
      - path: ../Shared/Glass.swift
      - path: ../Shared/MarkdownText.swift
      - path: ../Shared/RoutineOccurrenceDetailView.swift
      - path: ../Shared/JobViews.swift
      - path: ../Shared/ConversationActionButtonStyle.swift
      - path: ../Shared/WorkspaceSurface.swift
      - path: ../Shared/AgentSessionsView.swift
      - path: ../Shared/AgentSessionDetail.swift
      - path: ../Shared/ChatSkillPicker.swift
      - path: ../Shared/AgentImages.swift
      - path: ../Shared/FinanceTopicsView.swift
      - path: ../Shared/AgentSessionSheets.swift
      - path: ../Shared/AgentNewSession.swift
      - path: ../Shared/ComposerContextControl.swift
      - path: ../Shared/AgentNotifier.swift
      - path: ../Shared/CliTerminalView.swift
      - path: ../Shared/Assets.xcassets
    dependencies:
      - package: NexClientKit
      - package: NexMarkdown
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_MODULE_NAME: NexRenderFixture
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.renderfixture
  tests:
    type: bundle.unit-test
    sources:
      - path: ChartRenderingTests.swift
      - path: HTMLPreviewRenderingTests.swift
      - path: AvatarRenderingTests.swift
      - path: RoutineRenderingTests.swift
      - path: AgentRenderingTests.swift
    dependencies:
      - package: NexClientKit
      - package: NexMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.renderfixture.tests
targets:
  RenderMac:
    templates: [host]
    platform: macOS
    sources:
      - path: ../NexBotMac/ApprovalCard.swift
      - path: ../NexBotMac/ChatModelMenu.swift
      - path: ../NexBotMac/ModelPicker.swift
      - path: ../NexBotMac/ViewSupport.swift
  RenderiOS:
    templates: [host]
    platform: iOS
    sources:
      - path: ../NexBotiOS/ApprovalCard.swift
      - path: ../NexBotiOS/ChatModelSheet.swift
      - path: ../NexBotiOS/Support.swift
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RenderMacTests:
    templates: [tests]
    platform: macOS
    dependencies:
      - target: RenderMac
  RenderiOSTests:
    templates: [tests]
    platform: iOS
    dependencies:
      - target: RenderiOS
schemes:
  RenderMac:
    build:
      targets: { RenderMac: all }
    test:
      targets: [RenderMacTests]
  RenderiOS:
    build:
      targets: { RenderiOS: all }
    test:
      targets: [RenderiOSTests]
