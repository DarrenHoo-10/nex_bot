name: NexBot
options:
  bundleIdPrefix: com.nexbot
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  NexClientKit:
    path: Packages/NexClientKit
targets:
  NexBotMac:
    type: application
    platform: macOS
    sources:
      - NexBotMac
      - path: ../../build/nexbot-icon.icns
        buildPhase: resources
    dependencies:
      - package: NexClientKit
    info:
      path: NexBotMac/Info.plist
      properties:
        CFBundleDisplayName: NexBot
        CFBundleIconFile: nexbot-icon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.mac
        PRODUCT_NAME: NexBot
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Local builds: ad-hoc signing. Override with your team for distribution.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: NexBotMac/NexBotMac.entitlements
  NexBotiOS:
    type: application
    platform: iOS
    sources: [NexBotiOS]
    dependencies:
      - package: NexClientKit
    info:
      path: NexBotiOS/Info.plist
      properties:
        CFBundleDisplayName: NexBot
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexbot.ios
        PRODUCT_NAME: NexBot
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
schemes:
  NexBotMac:
    build: { targets: { NexBotMac: all } }
    run: { config: Debug }
  NexBotiOS:
    build: { targets: { NexBotiOS: all } }
    run: { config: Debug }
