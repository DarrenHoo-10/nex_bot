appId: com.nexbot.client
productName: NexBot Client
directories:
  output: release/personal-client
extraMetadata:
  name: nexbot-client
  version: 0.9.14
  main: electron/nex-client-main.mjs
npmRebuild: false
electronVersion: 39.8.10
electronDist: dist-personal/electron
asar: true
files:
  - electron/nex-client-main.mjs
  - electron/nex-client-preload.cjs
  - electron/nex-client-ui.mjs
  - electron/nex-client-device.mjs
  - electron/nex-client-clipboard.mjs
  - electron/nex-client-update.mjs
  - shared/model-catalog.mjs
  - electron/client/**
  - package.json
  - '!**/node_modules/**'
extraResources:
  - from: dist-personal/client-ui
    to: client-ui
  - from: dist-personal/client-executor
    to: client-executor
  - from: dist-personal/client-executor/node_modules
    to: client-executor/node_modules
    filter:
      - '**/*'
  - from: LICENSE
    to: LICENSE-OpenMausBot.txt
  - from: NOTICE
    to: NOTICE

win:
  target:
    - target: portable
      arch: x64
  icon: build/nexbot-icon.ico
portable:
  useZip: true
  unpackDirName: true
  artifactName: NexBot-${version}-x64-Client-Portable.${ext}
