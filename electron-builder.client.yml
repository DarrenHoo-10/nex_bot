appId: com.nexbot.client
productName: NexBot Client
directories:
  output: release/personal-client
extraMetadata:
  name: nexbot-client
  version: 0.7.0
  main: electron/nex-client-main.mjs
npmRebuild: false
electronVersion: 39.8.10
electronDist: dist-personal/electron
asar: true
files:
  - electron/nex-client-main.mjs
  - electron/nex-client-preload.cjs
  - electron/client/**
  - package.json
  - '!**/node_modules/**'
extraResources:
  - from: LICENSE
    to: LICENSE-OpenMausBot.txt
  - from: NOTICE
    to: NOTICE

win:
  target:
    - target: portable
      arch: x64
  icon: build/icon.ico
portable:
  useZip: true
  unpackDirName: true
  artifactName: NexBot-0.7.0-x64-Client-Portable.${ext}
