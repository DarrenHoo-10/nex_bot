appId: com.nexbot.personal
productName: NexBot
copyright: Copyright © NexBot contributors
directories:
  output: release/personal-os
extraMetadata:
  name: nexbot-personal-os
  version: 0.5.0
  main: electron/nex-main.mjs
npmRebuild: false
electronVersion: 39.8.10
electronDist: dist-personal/electron
asar: true
files:
  - electron/nex-main.mjs
  - electron/nex-preload.cjs
  - package.json
  - '!**/node_modules/**'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: dist-personal/core
    to: core
  - from: dist-personal/ui
    to: ui
  - from: dist-personal/node_modules
    to: node_modules
  - from: dist-personal/package.json
    to: package.json
  - from: dist-personal/LICENSE-OpenMausBot.txt
    to: LICENSE-OpenMausBot.txt
  - from: dist-personal/licenses
    to: licenses
  - from: dist-personal/memory-runtime
    to: memory-runtime
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!*.zip'
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  artifactName: NexBot-0.5.0-${arch}-${target}.${ext}
nsis:
  # The 7z template stages then CopyFiles thousands of runtime files. ZIP
  # extracts directly into the install directory and avoids that second copy.
  useZip: true
  differentialPackage: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: NexBot
  artifactName: NexBot-0.5.0-x64-Setup.${ext}
portable:
  # In this builder, useZip embeds files with NSIS's direct zlib expansion.
  useZip: true
  # In builder 26.15.3, true omits UNPACK_DIR_NAME and gives each launch
  # its own $PLUGINSDIR/app. A shared build directory breaks tray restore.
  unpackDirName: true
  artifactName: NexBot-0.5.0-x64-Core-Portable.${ext}
