name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs CI on the PR merged onto the current main BEFORE it
  # lands, so a PR that is green alone but red together with what just
  # merged is stopped in the queue instead of on main (that shape reddened
  # main twice in Sep 2026). Turning the queue on is a branch-ruleset
  # setting; this trigger is what lets CI report on those runs.
  merge_group:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  # A new PR push supersedes that PR's older checks. Main keeps one run going
  # and one waiting: each merge replaces the waiting run, so a burst of
  # merges costs two full runs, not one per merge (fifteen queued behind each
  # other in October 2026). The running one always finishes. A release runs
  # CI on its own commit in a release-ci/v<version> lane when main's run for
  # it was replaced (scripts/release-ci.mjs). Merge-queue runs stay on their
  # own refs. A PR's group is named by its number, never by github.ref: a
  # merged PR's closed event reports the base branch as github.ref, so a
  # ref-named group let every merge cancel main's run (ci-stop-closed.yml).
  group: ci-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only the core path is tested (2026-11-21, AGENTS.md): NexBot Core with
  # Agent mode, its web UI and the shared contracts, in one serial vitest run.
  # The suites, smokes and evals of the old OpenMausBot desktop app were
  # removed with their tests. `CI` aggregates the required jobs.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:electron
      - name: production UI build
        run: pnpm exec vite build

  android-core:
    # `:core` is a plain Kotlin/JVM module, so its suite runs without the
    # Android SDK (the Compose shell will need one later). The fixtures were
    # captured from an isolated Core; --check fails when its wire contract
    # drifts. This job is deliberately not part of the merge gate yet.
    name: Kotlin tests + Android fixtures
    needs: static
    if: needs.static.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          # Caches ~/.gradle/caches and the wrapper distribution, plus
          # Robolectric's android-all artifact (fetched at test time, which no
          # Gradle cache reaches).
          cache: gradle
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Android SDK packages
        # The runner image ships an Android SDK; :app needs platform 36 and the
        # matching build tools. :core itself needs none of this.
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.1.0"
      - name: Kotlin and app tests
        # A checkout made on Windows does not carry the executable bit.
        run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Android fixtures have not drifted from Core
        # Runs against the TypeScript source, so no platform-specific Core
        # bundle is needed on Linux.
        run: node --experimental-transform-types --no-warnings scripts/capture-android-fixtures.mjs --core=server/personal-os/index.ts --check


  core-tests:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Core, web UI and shared tests
        run: pnpm exec vitest run --reporter=default --reporter=github-actions

  gate:
    name: CI
    needs: [static, core-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) => `${result.padEnd(9)} ${job}`);
            console.log(rows.join("\n"));
            const runtime = needs.static.outputs.runtime;
            if (runtime !== "true" && runtime !== "false") throw new Error("Missing CI selection");
            const bad = Object.entries(needs).filter(([job, { result }]) => {
              const expected = job === "static" || runtime === "true" ? "success" : "skipped";
              return result !== expected;
            });
            if (bad.length) { console.error(`\n${bad.length} required job(s) did not pass: ${bad.map(([job]) => job).join(", ")}`); process.exit(1); }
          '
