name: Verify NexBot Windows Setup
on: workflow_dispatch
permissions:
  contents: read

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-nexbot-icons.mjs
      - run: pnpm package:client:win
      - run: node scripts/build-personal.mjs --core
      - run: ./scripts/testing/nexbot-setup.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-nexbot-setup
          path: release/personal-client/*-Client-Setup.exe
          if-no-files-found: error
          retention-days: 3
